<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepárate… ⏱️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/cuenta-regresiva.css">
</head>
<body>

    <canvas id="polenCanvas"></canvas>

    <div class="contenedor">

        <p class="etiqueta">Prepárate…</p>

        <div class="anillo-wrapper">
            <!-- Anillo de progreso (SVG) -->
            <svg class="anillo" viewBox="0 0 260 260">
                <circle class="anillo-fondo" cx="130" cy="130" r="115"/>
                <circle class="anillo-progreso" id="anilloProgreso" cx="130" cy="130" r="115"/>
            </svg>

            <!-- Número grande al centro -->
            <div class="numero" id="numero">10</div>
        </div>

        <p class="subtexto">Eyy mi chiquita... algo bonito esta por pasar 🌻</p>

        <!-- Botón saltar (discreto) -->
        <button class="btn-saltar" id="btnSaltar">Saltar →</button>

    </div>

    <script src="../js/musica.js"></script>
    <script src="../js/polen.js"></script>
    <script src="../js/cuenta-regresiva.js"></script>
</body>
</html>
